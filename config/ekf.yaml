# robot_localization EKF for car_s, run on the PC by launch/pc_bringup.launch.py.
#
# Fuses forward speed from the wheels with yaw rate from the gyro, and
# publishes odom -> base_link (the launch file turns off the controller's own
# TF while this runs). Wheel yaw isn't used: the car is a skid steer, so it
# slips whenever it turns. The magnetometer isn't used: the steppers distort it.
#
# Each *_config list is (x, y, z, roll, pitch, yaw,
#                        vx, vy, vz, vroll, vpitch, vyaw,
#                        ax, ay, az)
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    # Allow for WiFi latency between the Pi and the PC
    transform_timeout: 0.1
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry: forward speed, plus vy = 0 (it can't move sideways)
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    # Gyro: yaw rate only. The accelerometer is too noisy on this car to help
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
